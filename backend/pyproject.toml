[project]
name = "faro"
version = "0.1.0"
description = "Local, read-only programming assistant: indexing, hybrid search and RAG backend."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastembed==0.8.1",
    "httpx==0.28.1",
    "lancedb==0.39.0",
    "numpy==2.5.3",
    "onnxruntime==1.30.0",
    "pathspec==1.1.1",
    "platformdirs==4.12.3",
    "pyarrow==25.0.1",
    "tree-sitter==0.25.2",  # 0.26.0 corrupts memory (see tests/regressions)
    # Grammars ship compiled inside their wheels: nothing is downloaded at runtime.
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-json==0.24.8",
    "tree-sitter-lua==0.5.0",
    "tree-sitter-luau==1.2.0",
    "tree-sitter-markdown==0.5.1",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-yaml==0.7.2",
    # Canonical Dart grammar, built from source at a pinned commit (docs/PLAN.md 4.1).
    "tree-sitter-dart @ git+https://github.com/UserNobody14/tree-sitter-dart@be07cf7118d3dba06236a3f19541685a68209934",
]

[project.scripts]
faro = "faro.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.23"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "S", "N", "C4", "PIE", "RET", "TID"]
ignore = [
    "PTH",   # os.path is used on purpose for lexical, string-based path checks
    "RUF001", "RUF002", "RUF003",  # Spanish user-facing text contains accents and quotes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S603", "S607", "S108"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "pyarrow.*", "lancedb.*", "pathspec.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "windows_only: needs Windows (junctions, alternate data streams, CreateFileW...)",
    "posix_only: needs a POSIX system",
    "model: needs the real embedding model installed (FARO_TEST_MODEL_DIR)",
]
filterwarnings = ["error::DeprecationWarning:faro.*"]
